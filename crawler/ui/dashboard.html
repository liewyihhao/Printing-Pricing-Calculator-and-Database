<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Printoka — Pricing Intelligence</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet" />
<script>
tailwind.config = { theme: { extend: {
  fontFamily: { sans:['Inter','system-ui','sans-serif'], display:['Poppins','sans-serif'] },
  // Stripe surface ladder + navy-ink text; accent = Printoka orange (Brex-justified, not indigo).
  colors: { ink:'#061b31', brand:{50:'#fff1ec',500:'#ff5a2e',600:'#e6491c',700:'#c43c14'},
    slate:{50:'#f8fafd',100:'#f1f5f9',150:'#e9eef4',200:'#e5edf5',300:'#d8d6df',400:'#64748d',500:'#50617a',600:'#42526b',700:'#2c3a4f',900:'#061b31'} },
  boxShadow:{
    card:'0 0 0 1px rgba(60,66,87,.04), 0 2px 5px 0 rgba(60,66,87,.06), 0 1px 1.5px 0 rgba(0,0,0,.04)',
    pop:'0 0 0 1px rgba(60,66,87,.06), 0 7px 14px 0 rgba(60,66,87,.10), 0 3px 6px 0 rgba(0,0,0,.06)',
    btn:'0 1px 1px 0 rgba(0,0,0,.06), 0 1px 2px 0 rgba(60,66,87,.10)' } } } };
</script>
<style>
  html{color-scheme:light}
  body{-webkit-font-smoothing:antialiased;letter-spacing:-0.006em;font-feature-settings:"ss01","cv05"}
  h1,h2,h3{text-wrap:balance;letter-spacing:-0.018em;font-weight:600}
  .tabular,.tabular-nums,td,th{font-variant-numeric:tabular-nums}
  .brand-orb{background:conic-gradient(from 210deg,#ff3d2e,#ff8a00,#ffd000,#39c46e,#1fa2ff,#7b5bff,#ff3d2e)}
  .brand-gradient{background:linear-gradient(99deg,#ff5a2e 0%,#ff8a00 28%,#7b5bff 72%,#1fa2ff 100%)}
  .hairline{border-color:#e3e8ef}
  .nav-item{transition:background .12s,color .12s;cursor:pointer;position:relative}
  .nav-item:hover{background:#f1f5f9}
  .nav-item.active{background:#fff1ec;color:#c43c14}
  .nav-item.active svg{color:#e6491c}
  .nav-item.active::before{content:"";position:absolute;left:-12px;top:6px;bottom:6px;width:3px;border-radius:3px;background:#ff5a2e}
  .fieldsel{transition:border .12s,box-shadow .12s}
  .fieldsel:focus{outline:none;border-color:rgba(255,90,46,.55);box-shadow:0 0 0 3px rgba(255,90,46,.16)}
  .range-thumb::-webkit-slider-thumb{-webkit-appearance:none;height:18px;width:18px;border-radius:50%;background:#fff;border:2px solid #ff5a2e;box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:pointer;margin-top:-7px}
  .range-thumb{-webkit-appearance:none;height:4px;border-radius:4px;background:#e5edf5}
  .fade{animation:f .25s ease both}@keyframes f{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .seg.active{background:#ff5a2e;color:#fff}
  .tierbtn.active{border-color:#ff5a2e;background:#fff1ec;color:#c43c14}
  ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#d8d6df;border-radius:8px;border:3px solid #f8fafd}
</style>
</head>
<body class="font-sans bg-slate-50 text-slate-900">
<div class="flex min-h-screen">
  <!-- SIDEBAR -->
  <aside class="hidden lg:flex w-[240px] shrink-0 flex-col border-r hairline bg-white">
    <div class="flex items-center gap-2.5 px-5 h-16">
      <div class="brand-orb h-7 w-7 rounded-full shadow-sm"></div>
      <span class="font-display font-semibold text-[17px] tracking-tight text-ink">printoka</span>
    </div>
    <nav id="nav" class="flex-1 px-3 mt-2 space-y-0.5 text-[13.5px] text-slate-600 font-medium">
      <a data-view="overview" class="nav-item active flex items-center gap-3 rounded-lg px-3 py-2">
        <svg class="h-[18px] w-[18px] text-slate-400" viewBox="0 0 20 20" fill="none"><path d="M3 5.5A1.5 1.5 0 014.5 4h11A1.5 1.5 0 0117 5.5v9a1.5 1.5 0 01-1.5 1.5h-11A1.5 1.5 0 013 14.5v-9z" stroke="currentColor" stroke-width="1.4"/><path d="M3 8h14M7.5 8v8" stroke="currentColor" stroke-width="1.4"/></svg>Overview</a>
      <a data-view="products" class="nav-item flex items-center gap-3 rounded-lg px-3 py-2">
        <svg class="h-[18px] w-[18px] text-slate-400" viewBox="0 0 20 20" fill="none"><path d="M10 2.5l6.5 3.5v8L10 17.5 3.5 14V6L10 2.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M3.5 6l6.5 3.5L16.5 6M10 9.5v8" stroke="currentColor" stroke-width="1.4"/></svg>Products</a>
      <a data-view="formulation" class="nav-item flex items-center gap-3 rounded-lg px-3 py-2">
        <svg class="h-[18px] w-[18px] text-slate-400" viewBox="0 0 20 20" fill="none"><path d="M4 4h12M4 10h12M4 16h7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="15" cy="15" r="2.5" stroke="currentColor" stroke-width="1.4"/></svg>Printoka Formulation</a>
    </nav>
    <div class="p-3 border-t hairline">
      <div class="flex items-center gap-2.5 px-2 py-1.5">
        <div class="h-8 w-8 rounded-full bg-slate-700 text-white grid place-items-center text-[12px] font-semibold">YC</div>
        <div class="min-w-0"><div class="text-[12.5px] font-semibold text-slate-700 truncate">Yushan Corp</div><div class="text-[11px] text-slate-400">Pricing workspace</div></div>
      </div>
    </div>
  </aside>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="sticky top-0 z-20 h-16 bg-white/85 backdrop-blur border-b hairline flex items-center gap-3 px-4 sm:px-6">
      <div class="lg:hidden brand-orb h-7 w-7 rounded-full"></div>
      <h2 id="pagetitle" class="font-display font-semibold text-[15px] text-ink">Overview</h2>
      <span id="livebadge" class="ml-auto inline-flex items-center gap-1.5 text-[12px] font-medium text-emerald-700 bg-emerald-50 border border-emerald-100 rounded-full px-2.5 py-1">
        <span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span><span id="livetext">live data</span>
      </span>
    </header>
    <main id="main" class="flex-1 overflow-y-auto px-4 sm:px-6 lg:px-8 py-6"></main>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const RM = v => "RM " + Number(v).toLocaleString("en-MY",{minimumFractionDigits:2,maximumFractionDigits:2});
const NUM = v => Number(v).toLocaleString("en-US");
const TIERS = ["Platinum","Gold","Silver","Cash"];
async function api(p){ const r = await fetch(p); if(!r.ok) throw new Error(r.status); return r.json(); }

// ---------------- views ----------------
const views = {};

views.overview = async () => {
  const ps = await api("/api/printoka/product-status");
  const formed = ps.filter(p=>p.formulated);
  const best = formed.length ? Math.min(...formed.map(p=>p.accuracy)) : null;
  const el = document.createElement("div"); el.className="fade max-w-[1080px]";
  el.innerHTML = `
    <h1 class="font-display text-[26px] font-semibold tracking-tight text-ink">Overview</h1>
    <p class="text-slate-500 text-[13.5px] mt-0.5 mb-6">Printoka's own formula-driven pricing — independent, offline.</p>
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
      ${card("Products formulated", NUM(formed.length))}
      ${card("Products tracked", NUM(ps.length))}
      ${card("Best accuracy", best!=null ? best+"% median" : "—")}
      ${card("Pricing tiers", "4", "Platinum · Gold · Silver · Cash")}
    </div>
    <div class="bg-white rounded-xl border hairline shadow-card p-5">
      <h3 class="font-semibold text-[15px] text-ink mb-3">Formulated products</h3>
      ${formed.length ? formed.map(p=>`<div class="flex items-center gap-3 py-2 border-b hairline last:border-0">
        <div class="h-8 w-8 rounded-lg brand-gradient grid place-items-center text-white text-[11px] font-bold">${p.name[0]}</div>
        <div class="flex-1"><div class="font-semibold text-slate-800 text-[13.5px]">${p.name}</div>
          <div class="text-[11.5px] text-slate-400">accuracy ${p.accuracy}% median</div></div>
        <span class="text-[12px] font-medium text-emerald-700 bg-emerald-50 border border-emerald-100 rounded-full px-2 py-0.5">formulated</span></div>`).join("") : '<div class="text-slate-400 text-[13px]">None yet.</div>'}
    </div>`;
  return el;
};

views.products = async () => {
  const prods = await api("/api/printoka/product-status");
  const el = document.createElement("div"); el.className="fade max-w-[1080px]";
  el.innerHTML = `
    <h1 class="font-display text-[26px] font-semibold tracking-tight text-ink mb-1">Products</h1>
    <p class="text-slate-500 text-[13.5px] mb-5">${prods.length} product(s) tracked · ${prods.filter(p=>p.formulated).length} formulated.</p>
    <div class="bg-white rounded-xl border hairline shadow-card overflow-hidden">
      <table class="w-full text-[13.5px]">
        <thead class="text-slate-400 text-[12px] uppercase tracking-wide"><tr class="border-b hairline">
          <th class="text-left font-semibold px-4 py-2.5">Product</th>
          <th class="text-left font-semibold px-4 py-2.5">Category</th>
          <th class="text-right font-semibold px-4 py-2.5">Combos initiated</th>
          <th class="text-right font-semibold px-4 py-2.5">Accuracy test result</th>
          <th class="text-left font-semibold px-4 py-2.5">Status</th></tr></thead>
        <tbody>${prods.map(p=>`<tr class="border-b hairline last:border-0 hover:bg-slate-50/60">
          <td class="px-4 py-3"><div class="flex items-center gap-3"><div class="h-8 w-8 rounded-lg brand-gradient grid place-items-center text-white text-[11px] font-bold">${p.name[0]}</div>
            <div><div class="font-semibold text-slate-800">${p.name}</div><div class="text-[11.5px] text-slate-400 font-mono">prod_${p.id}</div></div></div></td>
          <td class="px-4 py-3 text-slate-500">${p.category||"—"}</td>
          <td class="px-4 py-3 text-right tabular-nums font-medium text-slate-700">${NUM(p.combos_initiated)}</td>
          <td class="px-4 py-3 text-right tabular-nums text-slate-600">${p.accuracy!=null? p.accuracy+"% median":"—"}</td>
          <td class="px-4 py-3">${p.formulated
            ? '<span class="inline-flex items-center gap-1.5 text-[12px] font-medium text-emerald-700 bg-emerald-50 border border-emerald-100 rounded-full px-2 py-0.5"><span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>formulated</span>'
            : '<span class="inline-flex items-center gap-1.5 text-[12px] font-medium text-slate-500 bg-slate-50 border border-slate-200 rounded-full px-2 py-0.5"><span class="h-1.5 w-1.5 rounded-full bg-slate-400"></span>not formulated</span>'}</td></tr>`).join("")}</tbody>
      </table>
    </div>`;
  return el;
};

// ---------------- calculator view ----------------
let calc = { ladder:null, colormode:"4C", buytier:"Platinum", token:0, mult:1 };
views.calculator = async () => {
  const el = document.createElement("div"); el.className="fade max-w-[920px]";
  el.innerHTML = `
    <h1 class="font-display text-[26px] font-semibold tracking-tight text-ink mb-1">Price calculator</h1>
    <p class="text-slate-500 text-[13.5px] mb-6">Real market prices → your suggested selling price.</p>
    <div class="grid md:grid-cols-[1fr_350px] gap-5">
      <div class="bg-white rounded-xl border hairline shadow-card p-5 space-y-5">
        ${selField("Size","c_size")}${selField("Paper","c_paper",true)}${selField("Print colour","c_colour",true)}${selField("Package (ganging)","c_package",true)}
        <div><label class="block text-[13px] font-medium text-slate-600 mb-1.5">Quantity</label><select id="c_qty" class="fieldsel w-full rounded-lg border hairline bg-white px-3 py-2 text-[13.5px]" disabled></select></div>
        <p class="text-[11.5px] text-slate-400">Only valid combinations are selectable — each choice narrows the next, exactly like the order page.</p>
        <div id="c_status" class="text-[12.5px] text-slate-400"></div>
      </div>
      <div class="bg-white rounded-xl border hairline shadow-card p-5 h-fit md:sticky md:top-20">
        <div class="text-[12.5px] font-semibold text-slate-400 uppercase tracking-wide mb-1">Market price — by tier <span class="text-[10px] normal-case text-slate-400 font-normal">(product only)</span></div>
        <div class="text-[11px] text-slate-400 mb-3">Cash = exact order-page price · others = Cash −4/−8/−14%</div>
        <div class="text-[11px] text-amber-700 bg-amber-50 border border-amber-100 rounded-md px-2 py-1 mb-3">Product price — <b>excludes delivery</b>. West/East Malaysia shipping added later.</div>
        <div id="c_tiers" class="space-y-1.5 text-[13px]"><div class="text-slate-400">Configure a job…</div></div>
        <div id="c_markup" class="hidden">
          <div class="border-t hairline my-4"></div>
          <div class="text-[12.5px] font-semibold text-slate-400 uppercase tracking-wide mb-2">Your selling price</div>
          <div class="flex items-center justify-between text-[12.5px] text-slate-500 mb-1"><span>Buy at tier</span><div id="c_buytier" class="flex gap-1"></div></div>
          <div class="flex items-center justify-between text-[12.5px] text-slate-500 mt-2"><span>Markup <span id="c_mkv" class="text-brand-600 font-semibold">35%</span></span><input id="c_mk" type="range" min="0" max="100" value="35" class="range-thumb w-28"></div>
          <div class="brand-gradient rounded-lg mt-3 p-3.5 text-white"><div class="text-[12px] opacity-80">Suggested selling price</div><div id="c_sell" class="text-[26px] font-display font-semibold tracking-tight leading-tight">—</div><div id="c_meta" class="text-[12px] opacity-80 mt-0.5">—</div></div>
        </div>
      </div>
    </div>`;
  setTimeout(initCalc, 0);
  return el;
};

function selField(label,id,dis){ return `<div><label class="block text-[13px] font-medium text-slate-600 mb-1.5">${label}</label>
  <select id="${id}" class="fieldsel w-full rounded-lg border hairline bg-white px-3 py-2 text-[13.5px] text-slate-700" ${dis?"disabled":""}></select></div>`; }

async function initCalc(){
  // Cascading options from order data — each level returns only combinations that
  // actually exist (no empty combos), exactly like the standard order page.
  const o = await api("/api/order/options");
  fillSel($("c_size"), o.sizes, "Select size…");
  $("c_buytier").innerHTML=""; TIERS.forEach((t)=>{ const b=document.createElement("button");
    b.className="tierbtn px-2 py-0.5 rounded-md border hairline text-[11.5px] "+(t==="Cash"?"active":""); b.textContent=t;
    b.onclick=()=>{ document.querySelectorAll('#c_buytier .tierbtn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); calc.buytier=t; renderSell(); }; $("c_buytier").appendChild(b); });
  calc.buytier="Cash";
  const opt = (extra) => api(`/api/order/options?${extra}`);
  $("c_size").onchange=async()=>{ const s=dv($("c_size")); resetSel(["c_paper","c_colour","c_package","c_qty"]); clearCalc(); if(!s)return;
    const o=await opt(`size=${encodeURIComponent(s)}`); fillSel($("c_paper"),o.papers,"Select paper…"); $("c_paper").disabled=false; };
  $("c_paper").onchange=async()=>{ const s=dv($("c_size")),p=dv($("c_paper")); resetSel(["c_colour","c_package","c_qty"]); clearCalc(); if(!p)return;
    const o=await opt(`size=${encodeURIComponent(s)}&paper=${encodeURIComponent(p)}`); fillSel($("c_colour"),o.colours,"Select print colour…"); $("c_colour").disabled=false; };
  $("c_colour").onchange=async()=>{ const s=dv($("c_size")),p=dv($("c_paper")),c=dv($("c_colour")); resetSel(["c_package","c_qty"]); clearCalc(); if(!c)return;
    const o=await opt(`size=${encodeURIComponent(s)}&paper=${encodeURIComponent(p)}&colour=${encodeURIComponent(c)}`); fillSel($("c_package"),o.packages,"Select package…"); $("c_package").disabled=false; };
  $("c_package").onchange=loadCalcQuote;
  $("c_qty").onchange=renderCalc; $("c_mk").oninput=()=>{ $("c_mkv").textContent=$("c_mk").value+"%"; renderSell(); };
}
function dv(sel){ return decodeURIComponent(sel.value||""); }
function fillSel(sel,items,ph){ sel.innerHTML=`<option value="">${ph}</option>`+items.map(i=>`<option value="${encodeURIComponent(i)}">${i}</option>`).join(""); }
function resetSel(ids){ ids.forEach(id=>{ $(id).innerHTML=""; $(id).disabled=true; }); }
function clearCalc(){ calc.ladder=null; $("c_tiers").innerHTML='<div class="text-slate-400">Configure a job…</div>'; $("c_markup").classList.add("hidden"); }
async function loadCalcQuote(){
  const s=dv($("c_size")),p=dv($("c_paper")),c=dv($("c_colour")),pk=dv($("c_package"));
  if(!s||!p||!c||!pk)return; const token=++calc.token; const prev=$("c_qty").value; $("c_status").textContent="Loading prices…";
  try{ const q=await api(`/api/order/quote?size=${encodeURIComponent(s)}&paper=${encodeURIComponent(p)}&colour=${encodeURIComponent(c)}&package=${encodeURIComponent(pk)}`);
    if(token!==calc.token)return; calc.ladder=q.ladder; calc.mult=(q.config&&q.config.multiplier)||1;
    $("c_qty").innerHTML=q.quantities.map(n=>`<option value="${n}">${NUM(n)}</option>`).join("");
    if(prev && q.quantities.includes(parseInt(prev))) $("c_qty").value=prev;
    $("c_qty").disabled=false; $("c_status").textContent=""; renderCalc();
  }catch(e){ if(token===calc.token){ $("c_status").textContent="Not crawled yet for this combination."; clearCalc(); } }
}
function renderCalc(){ if(!calc.ladder)return; const qty=parseInt($("c_qty").value); const row=calc.ladder[qty];
  if(!row){ $("c_tiers").innerHTML='<div class="text-slate-400">No price for this quantity.</div>'; return; }
  const tiers=row.tiers||{};
  const pieces=row.pieces||qty;
  $("c_tiers").innerHTML=TIERS.map(t=>`<div class="flex items-center justify-between py-1"><span class="text-slate-500">${t}${t==='Cash'?' <span class="text-[10px] text-emerald-600 font-medium">exact</span>':''}</span><span class="tabular-nums font-medium text-ink">${RM(tiers[t])}</span></div>`).join("")
    + (calc.mult>1?`<div class="flex items-center justify-between py-1 border-t hairline mt-1 pt-2"><span class="text-slate-400 text-[12px]">Total pieces <span class="text-[10px] text-brand-600">${qty}×${calc.mult}</span></span><span class="tabular-nums text-slate-600 text-[12px] font-medium">${NUM(pieces)} pcs</span></div>`:"")
    + (row.weight_kg?`<div class="flex items-center justify-between py-1${calc.mult>1?'':' border-t hairline mt-1 pt-2'}"><span class="text-slate-400 text-[12px]">Weight</span><span class="tabular-nums text-slate-500 text-[12px]">${row.weight_kg} kg</span></div>`:"");
  $("c_markup").classList.remove("hidden"); renderSell();
}
function renderSell(){ if(!calc.ladder)return; const qty=parseInt($("c_qty").value); const row=calc.ladder[qty]; if(!row)return;
  const cost=(row.tiers||{})[calc.buytier]; if(cost==null)return; const mk=parseInt($("c_mk").value); const sell=cost*(1+mk/100);
  const pieces=row.pieces||qty;
  $("c_sell").textContent=RM(sell); $("c_meta").textContent=`cost ${RM(cost)} (${calc.buytier}) · margin ${(((sell-cost)/sell)*100).toFixed(1)}% · ${RM(sell/pieces)}/pc${calc.mult>1?` (${NUM(pieces)} pcs)`:''}`; }

// ---------------- Printoka Formulation ----------------
views.formulation = async () => {
  const el=document.createElement("div"); el.className="fade max-w-[920px]";
  el.innerHTML=`
    <h1 class="font-display text-[26px] font-semibold tracking-tight text-ink mb-1">Printoka Formulation</h1>
    <p class="text-slate-500 text-[13.5px] mb-4">Our own offline pricing formula (first-principles print costing) + physics-based weight. Market price is a reference only.</p>
    <div id="f_kpi" class="mb-5 text-[12.5px] text-slate-400">Select a product…</div>
    <div class="grid md:grid-cols-[1fr_350px] gap-5">
      <div class="bg-white rounded-xl border hairline shadow-card p-5 space-y-4">
        ${selField("Product","f_product")}
        <div id="f_fields" class="space-y-4"></div>
        <div><label class="block text-[13px] font-medium text-slate-600 mb-1.5">Quantity (any value)</label>
          <input id="f_qty" type="number" min="1" value="1000" class="fieldsel w-full rounded-lg border hairline bg-white px-3 py-2 text-[13.5px]"></div>
        <p class="text-[11.5px] text-slate-400">Only valid combinations are selectable. Quantity accepts any number — the formula interpolates.</p>
        <div id="f_status" class="text-[12.5px] text-slate-400"></div>
      </div>
      <div class="bg-white rounded-xl border hairline shadow-card p-5 h-fit md:sticky md:top-20">
        <div class="text-[12.5px] font-semibold text-slate-400 uppercase tracking-wide mb-1">Printoka price — by tier</div>
        <div class="text-[11px] text-slate-400 mb-3">Our calculation · Cash = est. market cash · tiers −4/−8/−14%</div>
        <div id="f_out" class="space-y-1.5 text-[13px]"><div class="text-slate-400">Configure a job…</div></div>
      </div>
    </div>`;
  setTimeout(initForm,0);
  return el;
};
function fpid(){ const n=dv($("f_product")); const p=(window._fprods||[]).find(x=>x.name===n); return p?p.id:null; }
async function loadKpi(){ const pid=fpid(); if(!pid){ $("f_kpi").textContent="Select a product…"; return; }
  try{ const k=await api(`/api/printoka/kpi?product=${pid}`);
    if(k.median!=null) $("f_kpi").innerHTML=`<span class="inline-flex items-center gap-1.5 text-emerald-700 bg-emerald-50 border border-emerald-100 rounded-full px-2.5 py-1 font-medium">Accuracy vs market (spot-test): median ${k.median}% · ${k.within_5pct}% within 5% · ${k.within_10pct}% within 10%</span>`;
    else $("f_kpi").innerHTML=`<span class="text-amber-600">${k.note||'not calibrated yet'}</span>`;
  }catch(e){ $("f_kpi").textContent="(accuracy unavailable)"; } }
const BOOKLET=[19,37];
function isBooklet(pid){ return BOOKLET.includes(pid); }
async function initForm(){
  const prods=await api("/api/printoka/products"); window._fprods=prods;
  fillSel($("f_product"), prods.map(p=>p.name), "Select product…");
  $("f_product").onchange=async()=>{ clearF(); const pid=fpid(); if(!pid){ $("f_fields").innerHTML=""; return; }
    loadKpi(); isBooklet(pid)?initBookletFields(pid):initLooseFields(pid); };
  $("f_qty").oninput=()=>{ clearTimeout(window._ft); window._ft=setTimeout(loadForm,350); };
}
// ---- Loose Sheet (21 / 50) ----
function initLooseFields(pid){
  $("f_fields").innerHTML=selField("Size","f_size",true)+selField("Paper","f_paper",true)
    +selField("Print colour","f_colour",true)+selField("Package (ganging)","f_package",true);
  const opt=(x)=>api(`/api/printoka/options?product=${pid}&${x}`);
  (async()=>{ fillSel($("f_size"),(await api(`/api/printoka/options?product=${pid}`)).sizes,"Select size…"); $("f_size").disabled=false; })();
  $("f_size").onchange=async()=>{ const s=dv($("f_size")); resetSel(["f_paper","f_colour","f_package"]); clearF(); if(!s)return;
    fillSel($("f_paper"),(await opt(`size=${encodeURIComponent(s)}`)).papers,"Select paper…"); $("f_paper").disabled=false; };
  $("f_paper").onchange=async()=>{ const s=dv($("f_size")),p=dv($("f_paper")); resetSel(["f_colour","f_package"]); clearF(); if(!p)return;
    fillSel($("f_colour"),(await opt(`size=${encodeURIComponent(s)}&paper=${encodeURIComponent(p)}`)).colours,"Select colour…"); $("f_colour").disabled=false; };
  $("f_colour").onchange=async()=>{ const s=dv($("f_size")),p=dv($("f_paper")),c=dv($("f_colour")); resetSel(["f_package"]); clearF(); if(!c)return;
    fillSel($("f_package"),(await opt(`size=${encodeURIComponent(s)}&paper=${encodeURIComponent(p)}&colour=${encodeURIComponent(c)}`)).packages,"Select package…"); $("f_package").disabled=false; };
  $("f_package").onchange=loadForm;
}
// ---- Booklet (19 / 37) ----
function initBookletFields(pid){
  $("f_fields").innerHTML=selField("Orientation","b_orient",true)+selField("Size","b_size",true)
    +selField("Cover type","b_ordertype",true)+selField("Binding","b_binding",true)
    +selField("Pages (incl. cover)","b_page",true)+selField("Cover paper","b_cover",true)
    +selField("Content paper","b_content",true)+selField("Content print colour","b_colour",true);
  const bopt=(x)=>api(`/api/printoka/booklet/options?product=${pid}&${x}`);
  const enc=encodeURIComponent;
  const sel=id=>dv($(id));
  (async()=>{ fillSel($("b_orient"),(await bopt("")).orientations,"Select…"); $("b_orient").disabled=false; })();
  $("b_orient").onchange=async()=>{ resetSel(["b_size","b_ordertype","b_binding","b_page","b_cover","b_content","b_colour"]); clearF();
    const o=sel("b_orient"); if(!o)return; fillSel($("b_size"),(await bopt(`orientation=${enc(o)}`)).sizes,"Select…"); $("b_size").disabled=false; };
  $("b_size").onchange=async()=>{ resetSel(["b_ordertype","b_binding","b_page","b_cover","b_content","b_colour"]); clearF();
    const o=sel("b_orient"),s=sel("b_size"); if(!s)return; fillSel($("b_ordertype"),(await bopt(`orientation=${enc(o)}&size=${enc(s)}`)).ordertypes,"Select…"); $("b_ordertype").disabled=false; };
  $("b_ordertype").onchange=async()=>{ resetSel(["b_binding","b_page","b_cover","b_content","b_colour"]); clearF();
    const o=sel("b_orient"),s=sel("b_size"),ot=sel("b_ordertype"); if(!ot)return;
    fillSel($("b_binding"),(await bopt(`orientation=${enc(o)}&size=${enc(s)}&ordertype=${enc(ot)}`)).bindings,"Select…"); $("b_binding").disabled=false; };
  $("b_binding").onchange=async()=>{ resetSel(["b_page","b_cover","b_content","b_colour"]); clearF();
    const o=sel("b_orient"),s=sel("b_size"),ot=sel("b_ordertype"),b=sel("b_binding"); if(!b)return;
    const r=await bopt(`orientation=${enc(o)}&size=${enc(s)}&ordertype=${enc(ot)}&binding=${enc(b)}`);
    fillSel($("b_page"),r.pages,"Select pages…"); $("b_page").disabled=false;
    fillSel($("b_cover"),r.covers,"Select cover…"); $("b_cover").disabled=false;
    fillSel($("b_colour"),r.colours,"Select colour…"); $("b_colour").disabled=false; };
  $("b_cover").onchange=async()=>{ resetSel(["b_content"]); clearF();
    const o=sel("b_orient"),s=sel("b_size"),ot=sel("b_ordertype"),b=sel("b_binding"),cv=sel("b_cover"); if(!cv)return;
    const r=await bopt(`orientation=${enc(o)}&size=${enc(s)}&ordertype=${enc(ot)}&binding=${enc(b)}&cover=${enc(cv)}`);
    fillSel($("b_content"),r.contents,"Select content…"); $("b_content").disabled=false; };
  $("b_page").onchange=loadForm; $("b_content").onchange=loadForm; $("b_colour").onchange=loadForm;
}
function clearF(){ $("f_out").innerHTML='<div class="text-slate-400">Configure a job…</div>'; }
async function loadForm(){
  const pid=fpid(),qty=parseInt($("f_qty").value||"0"); if(!pid||!qty)return;
  const enc=encodeURIComponent; $("f_status").textContent="Calculating…";
  try{
    let q;
    if(isBooklet(pid)){
      const o=dv($("b_orient")),s=dv($("b_size")),ot=dv($("b_ordertype")),b=dv($("b_binding")),
            pg=dv($("b_page")),cv=dv($("b_cover")),ct=dv($("b_content")),cl=dv($("b_colour"));
      if(!o||!s||!ot||!b||!pg||!cv||!ct||!cl){ $("f_status").textContent=""; return; }
      q=await api(`/api/printoka/booklet/quote?product=${pid}&orientation=${enc(o)}&size=${enc(s)}&ordertype=${enc(ot)}&binding=${enc(b)}&page=${enc(pg)}&cover=${enc(cv)}&content=${enc(ct)}&colour=${enc(cl)}&qty=${qty}`);
    } else {
      const s=dv($("f_size")),p=dv($("f_paper")),c=dv($("f_colour")),pk=dv($("f_package"));
      if(!s||!p||!c||!pk){ $("f_status").textContent=""; return; }
      q=await api(`/api/printoka/quote?product=${pid}&size=${enc(s)}&paper=${enc(p)}&colour=${enc(c)}&package=${enc(pk)}&qty=${qty}`);
    }
    $("f_status").textContent="";
    if(q.printoka_cash==null){ $("f_out").innerHTML='<div class="text-amber-600">No basis to price this combo yet.</div>'; return; }
    const t=q.tiers||{};
    const dev=q.delta_pct==null?'':`<div class="flex items-center justify-between py-1 border-t hairline mt-1 pt-2"><span class="text-slate-400 text-[12px]">vs market ref</span><span class="tabular-nums text-[12px] ${Math.abs(q.delta_pct)<=5?'text-emerald-600':'text-amber-600'}">${q.delta_pct>0?'+':''}${q.delta_pct}%</span></div>`;
    $("f_out").innerHTML=TIERS.map(t2=>`<div class="flex items-center justify-between py-1"><span class="text-slate-500">${t2}</span><span class="tabular-nums font-medium text-ink">${RM(t[t2])}</span></div>`).join("")
      +`<div class="flex items-center justify-between py-1 border-t hairline mt-1 pt-2"><span class="text-slate-400 text-[12px]">Weight (est.)</span><span class="tabular-nums text-slate-500 text-[12px]">${q.weight_kg} kg</span></div>`
      +`<div class="flex items-center justify-between py-1"><span class="text-slate-400 text-[12px]">Method</span><span class="text-slate-500 text-[11px]">${q.method}</span></div>`
      +dev;
  }catch(e){ $("f_status").textContent="Could not price this combination."; clearF(); }
}

// ---------------- helpers + router ----------------
function card(label,value,sub){ return `<div class="bg-white rounded-xl border hairline shadow-card p-4">
  <div class="text-[12.5px] text-slate-500 font-medium">${label}</div><div class="mt-1.5 text-[22px] font-semibold tracking-tight text-ink">${value}</div>
  ${sub?`<div class="mt-0.5 text-[11.5px] text-slate-400">${sub}</div>`:""}</div>`; }
function progress(pct){ return `<div class="h-2.5 rounded-full bg-slate-100 overflow-hidden"><div class="h-full brand-gradient" style="width:${pct}%"></div></div>`; }
function statusPill(s){ const m={active:"emerald",done:"sky",unsupported:"slate"}[s]||"slate";
  return `<span class="inline-flex items-center gap-1.5 text-[12px] font-medium text-${m}-700 bg-${m}-50 border border-${m}-100 rounded-full px-2 py-0.5"><span class="h-1.5 w-1.5 rounded-full bg-${m}-500"></span>${s}</span>`; }
const titles={overview:"Overview",products:"Products",formulation:"Printoka Formulation"};

async function go(name){
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.view===name));
  $("pagetitle").textContent=titles[name]; $("main").innerHTML='<div class="text-slate-400 text-[13px]">Loading…</div>';
  try{ const node=await views[name](); $("main").innerHTML=""; $("main").appendChild(node); }
  catch(e){ $("main").innerHTML='<div class="text-rose-600 text-[13px]">Could not load data. Is the API running?</div>'; }
}
$("nav").addEventListener("click",e=>{ const a=e.target.closest('a[data-view]'); if(a) go(a.dataset.view); });

$("livetext").textContent="formula engine"; go("formulation");
</script>
