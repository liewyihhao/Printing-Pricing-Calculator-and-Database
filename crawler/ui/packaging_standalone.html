<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Printoka — Packaging Boxes (offline)</title>
<script src="https://cdn.tailwindcss.com"></script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<style>
  body{font-family:Inter,system-ui,sans-serif;background:#f6f8fc;color:#0f172a}
  .card{background:#fff;border:1px solid #e8edf5;border-radius:14px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .boxcard{cursor:pointer;transition:.15s}.boxcard:hover{border-color:#6366f1;transform:translateY(-1px)}
  .boxcard.sel{border-color:#6366f1;box-shadow:0 0 0 2px #6366f133}
  .tier{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #eef2f7;font-size:13px}
  input[type=range]{accent-color:#6366f1}
  .chip{font-size:11px;padding:2px 8px;border-radius:999px;background:#eef2ff;color:#4338ca}
</style>
</head>
<body class="min-h-screen">
<div class="max-w-[1240px] mx-auto px-5 py-6">
  <div class="flex items-center gap-3 mb-5">
    <div class="h-9 w-9 rounded-lg grid place-items-center text-white font-bold"
         style="background:linear-gradient(135deg,#6366f1,#8b5cf6)">P</div>
    <div><div class="font-semibold text-[15px]">Printoka — Packaging Boxes</div>
      <div class="text-[12px] text-slate-500">Custom folding-carton boxes · 3D preview · instant price</div></div>
    <a href="/" class="ml-auto text-[13px] text-indigo-600 hover:underline">← Other products</a>
  </div>

  <div class="grid grid-cols-12 gap-5">
    <!-- gallery -->
    <div class="col-span-4">
      <input id="search" placeholder="Search box styles…" class="w-full card px-3 py-2 text-[13px] mb-3 outline-none" />
      <div id="gallery" class="space-y-4 max-h-[78vh] overflow-auto pr-1"></div>
    </div>

    <!-- configurator -->
    <div class="col-span-8">
      <div id="empty" class="card p-10 text-center text-slate-400 text-[14px]">Select a box style to customize →</div>
      <div id="config" class="hidden">
        <div class="grid grid-cols-2 gap-5">
          <div class="card p-3"><div id="viewer" style="width:100%;height:360px;border-radius:10px;overflow:hidden;background:#0b1020"></div>
            <div class="flex items-center justify-center gap-2 mt-2">
              <button id="modeBox" class="chip" style="cursor:pointer">Folded 3D</button>
              <button id="modeNet" class="chip" style="cursor:pointer;background:#f1f5f9;color:#64748b">Flat dieline</button>
            </div>
            <div class="text-[11px] text-slate-400 mt-1 text-center">Drag to rotate · scroll to zoom · true to dimensions</div></div>
          <div class="card p-4">
            <div class="flex items-center gap-2 mb-1"><span id="cName" class="font-semibold text-[15px]"></span><span id="cCat" class="chip"></span></div>
            <div id="cCode" class="text-[12px] text-slate-400 mb-4"></div>
            <div class="space-y-4" id="dims"></div>
            <div class="grid grid-cols-2 gap-3 mt-4">
              <div><label class="text-[12px] text-slate-500">Material</label>
                <select id="material" class="w-full card px-2 py-2 text-[12px] mt-1 outline-none"></select></div>
              <div><label class="text-[12px] text-slate-500">Print colour</label>
                <select id="colour" class="w-full card px-2 py-2 text-[12px] mt-1 outline-none"></select></div>
              <div><label class="text-[12px] text-slate-500">Finishing</label>
                <select id="finishing" class="w-full card px-2 py-2 text-[12px] mt-1 outline-none"></select></div>
              <div><label class="text-[12px] text-slate-500">Quantity</label>
                <select id="qty" class="w-full card px-2 py-2 text-[12px] mt-1 outline-none">
                  <option>100</option><option>200</option><option selected>300</option><option>500</option>
                  <option>1000</option><option>2000</option><option>3000</option><option>5000</option></select></div>
            </div>
          </div>
        </div>
        <div class="card p-5 mt-5">
          <div class="flex items-end justify-between mb-3">
            <div><div class="text-[12px] text-slate-500">Printoka price (Cash)</div>
              <div id="cash" class="text-[30px] font-bold text-slate-800">—</div>
              <div id="unit" class="text-[12px] text-slate-500"></div></div>
            <div class="text-right"><div class="text-[12px] text-slate-500">Est. weight</div>
              <div id="weight" class="text-[15px] font-medium"></div>
              <div id="method" class="text-[11px] text-slate-400 mt-1"></div></div>
          </div>
          <div id="tiers"></div>
          <div id="note" class="text-[11px] text-slate-400 mt-3"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const $ = id => document.getElementById(id);
let CAT = [], sel = null, three = null;
const BAKED = window.PKG_DATA || null;   // present in the offline standalone build

// JS port of packaging_engine.cash_price (used in offline mode)
function pkgPrice(box, L, W, D, qty, material, finishing){
  const P = BAKED && BAKED.params; const p = P && P.boxes[box]; if(!p) return null;
  const na = Math.max(1, p.n[0]+p.n[1]*(L*W)+p.n[2]*((L+W)*D));
  const setup = p.t[0]+p.t[1]*na; let perpiece = p.t[2]+p.t[3]*na;
  perpiece *= (P.options.material[material] || 1);
  let cash = setup + perpiece*qty;
  const fd = P.options.finishing, fin = fd[finishing] || fd["+"+(finishing||"")];
  if(fin && finishing!=="P021" && finishing) cash += fin.setup + fin.perpiece*(na/(P.options.ref_na||1200))*qty;
  const uw = Math.max(0, p.w[0]+p.w[1]*na);
  const tiers={}; [["Cash",0],["Silver",.04],["Gold",.08],["Platinum",.14]].forEach(([t,d])=>tiers[t]=+(cash*(1-d)).toFixed(2));
  return { printoka_cash:+Math.max(0,cash).toFixed(2), tiers, weight_kg:+(uw*qty).toFixed(3),
    method:"formula (area-law + options)", note:"Folding-carton box; print colour does not affect price." };
}

let OPTS = {materials:[],colours:[],finishing:[]};
async function load(){
  CAT = BAKED ? BAKED.catalogue : await (await fetch("/api/printoka/packaging/catalogue")).json();
  try{ OPTS = BAKED ? BAKED.options : await (await fetch("/api/printoka/packaging/options")).json(); }catch(e){}
  $("material").innerHTML = (OPTS.materials||[]).map(m=>`<option value="${m.id}">${m.name}</option>`).join("");
  $("colour").innerHTML   = (OPTS.colours||[]).map(c=>`<option value="${c.id}" ${c.id===4?'selected':''}>${c.name}</option>`).join("");
  $("finishing").innerHTML= `<option value="P021" selected>Gloss Lamination (default)</option><option value="none">None</option>`
    + (OPTS.finishing||[]).filter(f=>f.id!=="P021").map(f=>`<option value="${f.id}">${f.name}</option>`).join("");
  ["material","colour","finishing"].forEach(id=>$(id).onchange=quote);
  renderGallery("");
}
function renderGallery(q){
  q = (q||"").toLowerCase();
  const groups = {};
  for(const b of CAT){
    if(q && !(b.name.toLowerCase().includes(q)||b.code.toLowerCase().includes(q)||b.category.toLowerCase().includes(q))) continue;
    (groups[b.category]=groups[b.category]||[]).push(b);
  }
  $("gallery").innerHTML = Object.entries(groups).map(([cat,boxes])=>`
    <div><div class="text-[12px] font-semibold text-slate-500 mb-2">${cat} <span class="text-slate-400">(${boxes.length})</span></div>
      <div class="grid grid-cols-2 gap-2">${boxes.map(b=>`
        <div class="boxcard card p-2 ${sel&&sel.code===b.code?'sel':''}" data-code="${b.code}">
          <div class="h-20 grid place-items-center bg-slate-50 rounded mb-1 overflow-hidden">
            ${b.image?`<img src="${b.image}" class="max-h-20 object-contain" onerror="this.style.display='none'"/>`:''}</div>
          <div class="text-[11px] font-medium leading-tight truncate" title="${b.name}">${b.name}</div>
          <div class="text-[10px] text-slate-400">${b.code}</div>
        </div>`).join("")}</div></div>`).join("");
  document.querySelectorAll(".boxcard").forEach(el=>el.onclick=()=>select(el.dataset.code));
}
$("search").oninput = e => renderGallery(e.target.value);

let MODE = "box", DIELINE = null;
const TUBE_CATS = ["Reverse Tuck (RTE)","Straight Tuck (STE)","Lock Bottom"];
function isTube(){ return sel && TUBE_CATS.includes(sel.category); }

async function select(code){
  sel = CAT.find(b=>b.code===code); if(!sel) return;
  document.querySelectorAll(".boxcard").forEach(e=>e.classList.toggle("sel", e.dataset.code===code));
  $("empty").classList.add("hidden"); $("config").classList.remove("hidden");
  $("cName").textContent = sel.name; $("cCat").textContent = sel.category; $("cCode").textContent = "Style "+sel.code;
  const L0=Math.max(sel.limits.L,80), W0=Math.max(sel.limits.W,60), D0=Math.max(sel.limits.Dmin,40);
  const lims = sel.limits;
  $("dims").innerHTML = [
    ["L","Length", lims.L, 400, L0],["W","Width", lims.W, 400, W0],
    ["D","Depth/Height", lims.Dmin, lims.Dmax||400, D0]
  ].map(([k,lab,mn,mx,v])=>`
    <div><div class="flex justify-between text-[12px] text-slate-500"><span>${lab}</span>
      <span><b id="v${k}">${v}</b> mm</span></div>
      <input type="range" id="r${k}" min="${mn}" max="${mx}" value="${v}" class="w-full"/></div>`).join("");
  ["L","W","D"].forEach(k=>$("r"+k).oninput=()=>{ $("v"+k).textContent=$("r"+k).value; updateBox(); quote(); });
  $("qty").onchange = quote;
  DIELINE = null;
  if(BAKED){ DIELINE = BAKED.dielines[sel.code]||null; }
  else fetch(`/api/printoka/packaging/dieline?box=${sel.code}`).then(r=>r.ok?r.json():null).then(d=>{ DIELINE=d; if(MODE==="net") updateBox(); }).catch(()=>{});
  initThree(); updateBox(); quote();
}
$("modeBox").onclick=()=>{ MODE="box"; setModeBtns(); updateBox(); };
$("modeNet").onclick=()=>{ MODE="net"; setModeBtns(); updateBox(); };
function setModeBtns(){
  $("modeBox").style.cssText = "cursor:pointer"+(MODE==="box"?"":";background:#f1f5f9;color:#64748b");
  $("modeNet").style.cssText = "cursor:pointer"+(MODE==="net"?"":";background:#f1f5f9;color:#64748b");
}

// ---- 3D : folded carton (tube archetypes) / size-accurate solid / flat dieline net ----
function initThree(){
  if(three){ three.dispose(); }
  const el=$("viewer"); el.innerHTML="";
  const w=el.clientWidth,h=el.clientHeight;
  const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0b1020);
  const cam=new THREE.PerspectiveCamera(40,w/h,1,5000); cam.position.set(320,260,360);
  const rnd=new THREE.WebGLRenderer({antialias:true}); rnd.setSize(w,h); rnd.setPixelRatio(devicePixelRatio); el.appendChild(rnd.domElement);
  scene.add(new THREE.AmbientLight(0xffffff,.75));
  const dl=new THREE.DirectionalLight(0xffffff,.9); dl.position.set(1,2,1.5); scene.add(dl);
  const grid=new THREE.GridHelper(800,16,0x334155,0x1e293b); grid.position.y=-1; scene.add(grid);
  const ctrl=new OrbitControls(cam,rnd.domElement); ctrl.enableDamping=true;
  const mat=new THREE.MeshLambertMaterial({color:0xc9a66b});
  const edge=new THREE.LineBasicMaterial({color:0x6b4f2a});
  const group=new THREE.Group(); scene.add(group);
  three={scene,cam,rnd,ctrl,group,mat,edge,
    dispose(){ rnd.dispose(); el.innerHTML=""; }};
  (function loop(){ if(three){ three.ctrl.update(); three.rnd.render(three.scene,three.cam); requestAnimationFrame(loop);} })();
}
function updateBox(){
  if(!three) return;
  const L=+$("rL").value, W=+$("rW").value, D=+$("rD").value;
  three.group.clear(); three.group.rotation.set(0,0,0); three.group.position.set(0,0,0);
  if(MODE==="net"){ buildNet(); }
  else {
    const c = sel ? sel.category : "";
    if(TUBE_CATS.includes(c)) buildCarton(L,W,D,{bottom:true,tuck:true});
    else if(c==="Trays & Top-Base") buildCarton(L,W,D,{bottom:true,tuck:false});
    else if(c==="Sleeve") buildCarton(L,W,D,{bottom:false,tuck:false});
    else if(c==="Hinged Lid / RETF") buildCarton(L,W,D,{bottom:true,lid:true});
    else { const g=new THREE.BoxGeometry(L,D,W); three.group.add(new THREE.Mesh(g,three.mat));
           three.group.add(new THREE.LineSegments(new THREE.EdgesGeometry(g),three.edge)); }
    three.group.position.y=D/2;
  }
  const r=Math.max(L,W,D); three.cam.position.setLength(r*2.2+220);
}

// Generic folded carton: 4 walls + optional bottom / tuck flap / hinged lid.
// opts: {bottom, tuck (ajar tuck flap), lid (full hinged lid, ajar)}
function buildCarton(L,W,D,opts){
  const t=2;
  const panel=(geo,x,y,z,rx,ry)=>{ const m=new THREE.Mesh(geo,three.mat);
    m.position.set(x,y,z); if(rx)m.rotation.x=rx; if(ry)m.rotation.y=ry; three.group.add(m);
    const e=new THREE.LineSegments(new THREE.EdgesGeometry(geo),three.edge);
    e.position.copy(m.position); e.rotation.copy(m.rotation); three.group.add(e); };
  panel(new THREE.BoxGeometry(L,D,t), 0,0, W/2);
  panel(new THREE.BoxGeometry(L,D,t), 0,0,-W/2);
  panel(new THREE.BoxGeometry(W,D,t), -L/2,0,0, 0, Math.PI/2);
  panel(new THREE.BoxGeometry(W,D,t),  L/2,0,0, 0, Math.PI/2);
  if(opts.bottom!==false) panel(new THREE.BoxGeometry(L,t,W), 0,-D/2,0);
  if(opts.tuck) panel(new THREE.BoxGeometry(L,t,W*0.55), 0, D/2, -W*0.1, -0.5);
  if(opts.lid)  // full lid hinged on the back edge, ajar
    panel(new THREE.BoxGeometry(L,t,W), 0, D/2 + W*0.28, -W*0.18, -1.05);
}

// Flat dieline net from LinTest3D LineExp: solid=cut, dash=crease, plus arcs.
function buildNet(){
  if(!DIELINE||!DIELINE.LineExp){ const g=new THREE.PlaneGeometry(120,80);
    three.group.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0x1e293b}))); return; }
  const bj=DIELINE.BoxJson||{}, ox=bj.OffsetX||0, oy=bj.OffsetY||0;
  const cut=new THREE.LineBasicMaterial({color:0xffd27f}), crease=new THREE.LineDashedMaterial({color:0x6ee7ff,dashSize:4,gapSize:3});
  const pts2=(x,y)=>new THREE.Vector3(x+ox, 0, -(y+oy));
  for(const s of DIELINE.LineExp){
    if(s[0]===0){ const g=new THREE.BufferGeometry().setFromPoints([pts2(s[2],s[3]),pts2(s[4],s[5])]);
      const ln=new THREE.Line(g, s[1]===1?crease:cut); ln.computeLineDistances(); three.group.add(ln); }
    else if(s[0]===1){ const [,,cx,cy,r,a0,a1]=s; const pts=[]; const steps=10;
      for(let i=0;i<=steps;i++){ const a=(a0+(a1-a0)*i/steps)*Math.PI/180; pts.push(pts2(cx+r*Math.cos(a), cy+r*Math.sin(a))); }
      const ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), s[1]===1?crease:cut); ln.computeLineDistances(); three.group.add(ln); }
  }
  three.group.rotation.x=-Math.PI/2.2;  // lay the net facing the camera
}

let seq=0;
async function quote(){
  if(!sel) return; const my=++seq;
  const L=+$("rL").value,W=+$("rW").value,D=+$("rD").value,qty=+$("qty").value;
  const mat=$("material").value, col=$("colour").value, fin=$("finishing").value;
  $("cash").textContent="…";
  const q = BAKED ? pkgPrice(sel.code,L,W,D,qty,mat,fin)
                  : await (await fetch(`/api/printoka/packaging/quote?box=${sel.code}&L=${L}&W=${W}&D=${D}&qty=${qty}&material=${mat}&colour=${col}&finishing=${fin}`)).json();
  if(my!==seq) return;
  if(q.error){ $("cash").textContent="—"; $("note").textContent=q.error; return; }
  $("cash").textContent="RM "+q.printoka_cash.toFixed(2);
  $("unit").textContent="RM "+(q.printoka_cash/qty).toFixed(3)+" / box · "+qty+" pcs";
  $("weight").textContent=q.weight_kg+" kg";
  $("method").textContent=q.method;
  $("note").textContent=q.note||"";
  $("tiers").innerHTML=Object.entries(q.tiers).map(([t,v])=>
    `<div class="tier"><span class="text-slate-500">${t}</span><span class="font-medium">RM ${v.toFixed(2)}</span></div>`).join("");
}
load();
