<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Printoka — Supplier Catalogue Coverage</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{font-family:Inter,system-ui,sans-serif;background:#f6f8fc;color:#0f172a}
  .card{background:#fff;border:1px solid #e8edf5;border-radius:14px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .b-built{background:#dcfce7;color:#166534}.b-new{background:#fef3c7;color:#92400e}.b-no{background:#f1f5f9;color:#64748b}
  .badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px}
</style>
</head>
<body class="min-h-screen">
<div class="max-w-[1100px] mx-auto px-5 py-6">
  <div class="flex items-center gap-3 mb-5">
    <div class="h-9 w-9 rounded-lg grid place-items-center text-white font-bold" style="background:linear-gradient(135deg,#6366f1,#8b5cf6)">P</div>
    <div><div class="font-semibold text-[15px]">Supplier Catalogue Coverage</div>
      <div class="text-[12px] text-slate-500">Auto check-up of the full supplier catalogue — what's new and what we've built</div></div>
    <a href="/" class="ml-auto text-[13px] text-indigo-600 hover:underline">← Calculator</a>
    <button id="rescan" class="ml-3 text-[13px] card px-3 py-1.5 hover:bg-slate-50">Re-scan now</button>
  </div>

  <div class="grid grid-cols-4 gap-3 mb-5">
    <div class="card p-4"><div class="text-[12px] text-slate-500">catalogue products</div><div id="s_total" class="text-[26px] font-bold">—</div></div>
    <div class="card p-4"><div class="text-[12px] text-slate-500">Built by us</div><div id="s_built" class="text-[26px] font-bold text-emerald-600">—</div></div>
    <div class="card p-4"><div class="text-[12px] text-slate-500">Not yet built</div><div id="s_todo" class="text-[26px] font-bold text-slate-400">—</div></div>
    <div class="card p-4"><div class="text-[12px] text-slate-500">New since last scan</div><div id="s_new" class="text-[26px] font-bold text-amber-500">—</div></div>
  </div>
  <div id="scanned" class="text-[12px] text-slate-400 mb-2"></div>
  <div id="newbanner" class="hidden card p-3 mb-4 b-new text-[13px]"></div>
  <div id="grid" class="space-y-5"></div>
</div>

<script>
const $=id=>document.getElementById(id);
async function load(url){
  const c=await (await fetch(url)).json();
  $("s_total").textContent=c.total; $("s_built").textContent=c.built;
  $("s_todo").textContent=(c.total-c.built); $("s_new").textContent=(c.new_since_last||[]).length;
  $("scanned").textContent="Last scan: "+(c.scanned_at||"—");
  if((c.new_since_last||[]).length){ $("newbanner").classList.remove("hidden");
    $("newbanner").textContent="🆕 New in catalogue since last scan: "+c.new_since_last.join(", "); }
  else $("newbanner").classList.add("hidden");
  const groups={};
  for(const p of c.products){ (groups[p.category]=groups[p.category]||[]).push(p); }
  $("grid").innerHTML=Object.entries(groups).map(([cat,ps])=>`
    <div class="card p-4"><div class="font-semibold text-[13px] text-slate-600 mb-2">${cat}
      <span class="text-slate-400">(${ps.filter(x=>x.built).length}/${ps.length} built)</span></div>
      <div class="grid grid-cols-2 gap-2">${ps.map(p=>`
        <a href="${p.url}" target="_blank" class="flex items-center justify-between border hairline rounded-lg px-3 py-2 hover:bg-slate-50">
          <span class="text-[13px] ${p.built?'text-slate-800':'text-slate-500'}">${p.name}${p.built_as&&p.built_as.length?`<span class="block text-[10px] text-slate-400">${p.built_as.join(', ')}</span>`:''}</span>
          <span class="badge ${p.built?'b-built':(p.is_new?'b-new':'b-no')}">${p.built?'Built':(p.is_new?'NEW':'Not built')}</span>
        </a>`).join("")}</div></div>`).join("");
}
$("rescan").onclick=async()=>{ $("rescan").textContent="Scanning…"; await load("/api/printoka/catalogue/scan"); $("rescan").textContent="Re-scan now"; };
load("/api/printoka/catalogue/coverage");
</script>
</body>
</html>
